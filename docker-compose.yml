name: wx_cups-web

services:
  wx_cups-web:
    build: ./wx_cups-web
    network_mode: host
    environment:
      CUPS_WEB_URL: ${CUPS_WEB_URL:-http://127.0.0.1:8080}
      CUPS_WEB_USER: ${CUPS_WEB_USER:-wecom-gateway}
      CUPS_WEB_PASSWORD: ${CUPS_WEB_PASSWORD:?请设置 cups-web 专用用户密码}
      PRINTER_URI: ${PRINTER_URI:?请设置 CUPS 打印机 URI}
      WECOM_BOT_ID: ${WECOM_BOT_ID:?请设置企业微信机器人 ID}
      WECOM_BOT_SECRET: ${WECOM_BOT_SECRET:?请设置企业微信机器人 Secret}
      WECOM_ALLOWED_USERS: ${WECOM_ALLOWED_USERS:?请设置逗号分隔的企业微信 userid 白名单}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
